<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discrete Math Games: Trees and Graphs</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#5d6678;--line:#d9deea;--acc:#3456d1;--acc2:#e9eefc;--good:#1f8a4c;--goodbg:#e6f6ec;--bad:#c0392b;--badbg:#fdecea;--warn:#b26a00;--op:#eef1ff;--sel:#f39c12}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#1d2433;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{font-size:18px;margin:0 12px 0 0}
header nav{display:flex;flex-wrap:wrap;gap:6px}
header nav button{background:transparent;color:#cfd6e6;border:1px solid #3a4560;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px}
header nav button.on{background:#fff;color:#1d2433}
header .who{font-size:14px;color:#cfd6e6}
main{max-width:1020px;margin:16px auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:20px}
h3{margin:12px 0 6px;font-size:16px}
button{font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:7px 14px;cursor:pointer;margin:2px}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--mute);font-size:14px;margin-bottom:8px}
.pill{background:var(--acc2);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:13px}
.focus{background:#fff4e0;color:var(--warn)}
.prompt{font-size:17px;margin:6px 0}
.expr{font:600 22px/1.3 ui-monospace,Menlo,Consolas,monospace;background:#f2f4fa;border-radius:8px;padding:8px 12px;display:inline-block;margin:4px 0 10px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{min-width:40px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font:600 18px ui-monospace,Menlo,monospace;cursor:pointer}
.chip.opchip{background:var(--op)}
.chip:disabled{opacity:.3;cursor:default}
.svgwrap{overflow-x:auto;background:#fbfcff;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
svg{max-width:100%;height:auto}
svg text{font:600 16px ui-monospace,Menlo,monospace;pointer-events:none;user-select:none}
.nd circle{fill:#fff;stroke:#7b86a0;stroke-width:2;cursor:pointer}
.nd.op circle{fill:var(--op)}
.nd.empty circle{fill:#fff;stroke-dasharray:4 3;stroke:#a7b0c4}
.nd.empty text{fill:#a7b0c4}
.nd.sel circle{stroke:var(--sel);stroke-width:4}
.nd.picked circle{fill:#dfe7ff;stroke:var(--acc)}
.nd.good circle{fill:var(--goodbg);stroke:var(--good);stroke-width:3}
.nd.bad circle{fill:var(--badbg);stroke:var(--bad);stroke-width:3}
.nd .badge{font-size:11px;fill:var(--acc)}
.vx circle{fill:#fff;stroke:#7b86a0;stroke-width:2;cursor:pointer}
.vx.visited circle{fill:var(--goodbg);stroke:var(--good)}
.vx.cur circle{stroke:var(--sel);stroke-width:4}
.vx.front circle{fill:#fff8e6}
.vx.flash circle{fill:var(--badbg);stroke:var(--bad);stroke-width:3}
.vx .badge,.vx .deg{font-size:11px}
.vx .badge{fill:var(--good)}
.vx .deg{fill:var(--mute)}
line.e{stroke:#b4bccd;stroke-width:2.5}
line.e.tree{stroke:var(--good);stroke-width:5}
line.e.used{stroke:var(--acc);stroke-width:5}
.etxt{font-size:11px!important;fill:var(--acc)}
.fb{border-radius:8px;padding:8px 12px;margin:10px 0;display:none}
.fb.good{display:block;background:var(--goodbg);color:var(--good)}
.fb.bad{display:block;background:var(--badbg);color:var(--bad)}
.fb.info{display:block;background:var(--acc2);color:var(--acc)}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:14px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.panel{background:#f7f8fc;border:1px solid var(--line);border-radius:8px;padding:10px}
.ds{display:flex;flex-wrap:wrap;gap:4px;min-height:36px;align-items:center}
.ds span{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font:600 15px ui-monospace,monospace}
.ds span.hot{border-color:var(--acc);background:var(--acc2)}
.small{font-size:13px;color:var(--mute)}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
table.t th,table.t td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
table.t th{background:#f2f4fa}
input[type=text],textarea,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
textarea{width:100%;min-height:140px;font:13px ui-monospace,monospace}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.gamecard{cursor:pointer}
.gamecard:hover{border-color:var(--acc)}
.choice{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.choice button.on{outline:3px solid var(--sel)}

/* ---- story, avatars, rewards ---- */
#stats{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;margin-left:auto}
#stats .rk{font-weight:600}
.xpbar{height:6px;width:120px;background:#3a4560;border-radius:9px;overflow:hidden;margin-top:3px}
.xpbar.wide{width:100%;background:#e6e9f2;height:8px;margin:6px 0 2px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f1c40f,#f39c12);border-radius:9px;transition:width .6s}
.coin{color:#f1c40f;font-weight:700}
.flame{color:#ffb36b;font-weight:700}
.banner{display:flex;gap:14px;align-items:center;border-radius:12px;padding:12px 16px;margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 18%,#fff),#fff);border:1px solid color-mix(in srgb,var(--rc) 35%,#fff)}
.bicon{font-size:38px;line-height:1}
.btitle{font-size:21px;font-weight:700;color:var(--rc)}
.bsub{font-size:14px;color:var(--mute)}
.region{cursor:pointer;border-top:6px solid var(--rc)}
.region:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.region .bicon{font-size:44px}
.avatars{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.avbtn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px;cursor:pointer;text-align:center}
.avbtn:hover{border-color:var(--acc)}
.avbtn.on{border-color:var(--sel);background:#fff8e6}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;background:#fff}
.bdg .medal{width:28px;height:28px;font-size:16px}
.bdg.locked{opacity:.4;filter:grayscale(1)}
.medal{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f1a90f);color:#7a4b00;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
#companion{position:fixed;right:14px;bottom:14px;display:flex;align-items:flex-end;gap:6px;z-index:50;pointer-events:none}
#companion .bubble{background:#fff;border:2px solid var(--line);border-radius:14px 14px 2px 14px;padding:8px 12px;max-width:230px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
#companion.bounce svg{animation:bounce .5s}
@keyframes bounce{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}
#toasts{position:fixed;top:100px;right:14px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid var(--line);border-left:5px solid #f1a90f;border-radius:10px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.12);transition:opacity .5s,transform .5s;animation:slidein .4s}
.toast.out{opacity:0;transform:translateX(30px)}
.toastin{display:flex;gap:10px;align-items:center}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.floatxp{position:fixed;left:50%;top:40%;transform:translateX(-50%);font:800 30px system-ui;color:#f39c12;text-shadow:0 2px 0 #fff;z-index:70;animation:floatup 1.4s forwards;pointer-events:none}
@keyframes floatup{to{top:25%;opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:105%;transform:rotate(720deg)}}
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.story{background:#fffdf6;border:3px solid #e8d9a8;border-radius:16px;max-width:460px;padding:20px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:pop .35s}
.story p{font-size:16px;line-height:1.5}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.intro{background:linear-gradient(135deg,#1d2433,#34406a);color:#fff;border:0}
.intro p{color:#dfe4f2}
@media(max-width:600px){#companion .bubble{display:none}#companion svg{width:48px;height:48px}}
@media (prefers-reduced-motion: reduce){.confetti,.floatxp{display:none}#companion.bounce svg{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Discrete Math Games</h1>
  <nav id="nav"></nav>
  <div id="stats"></div>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>
<script>
'use strict';
/* =========================================================================
   Discrete Math Games: expression trees, BFS vs DFS, Euler paths.
   Every puzzle is produced by a generator and accepted only after a
   validator passes (generate -> validate -> reject/repair loop). Each
   student action is logged with an anonymous ID and a misconception code
   (M1..M7, matching the pilot quiz). Data stays in this browser until the
   student or instructor downloads it as CSV.
   ========================================================================= */

// ---------- small helpers ----------
const $ = (q, r = document) => r.querySelector(q);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function S(tag, attrs, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) { if (k == null) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Math.random().toString(36).slice(2, 8);
const arrEq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const clone = o => JSON.parse(JSON.stringify(o));

// ---------- misconception codes (shared with the pilot quiz) ----------
const CODES = {
  M1: 'Precedence', M2: 'Operand order / associativity', M3: 'Traversal order (prefix/infix/postfix)',
  M4: 'BFS/DFS frontier (stack vs queue)', M5: 'Visited tracking (revisit/skip vertex or edge)',
  M6: 'Euler condition (circuit vs path rule)', M7: 'Euler start vertex', OTHER: 'Other'
};
const SUB2CODE = {
  'precedence': 'M1', 'associativity': 'M2', 'operand-order': 'M2', 'regrouped-equivalent': 'M2',
  'prefix-postfix-confusion': 'M3', 'traversal-confusion': 'M3', 'right-before-left': 'M3', 'reversed-order': 'M3',
  'dfs-like': 'M4', 'lifo-instead-of-fifo': 'M4', 'queue-order': 'M4', 'bfs-like': 'M4', 'backtrack-error': 'M4',
  'revisit': 'M5', 'reused-edge': 'M5', 'not-an-edge': 'M5',
  'circuit-rule-for-path': 'M6', 'circuit-vs-path': 'M6', 'missed-existence': 'M6', 'false-existence': 'M6',
  'wrong-start-vertex': 'M7'
};
const codeOf = sub => SUB2CODE[sub] || 'OTHER';

// ---------- state ----------
const State = {
  sid: localStorage.getItem('dmg_sid') || '',
  consent: localStorage.getItem('dmg_consent') || '',
  session: uid() + Date.now().toString(36).slice(-4),
  page: 'home',
  levels: (() => { try { return JSON.parse(localStorage.getItem('dmg_levels') || '{}'); } catch { return {}; } })(),
  streak: {}, recentErr: {}, recent: {},
  queue: { expr: [], bfsdfs: [], euler: [] }
};
function getLevel(g) { return State.levels[g] || 1; }
function setLevel(g, v) { State.levels[g] = Math.max(1, Math.min(4, v)); localStorage.setItem('dmg_levels', JSON.stringify(State.levels)); }
/* Adaptive difficulty: two clean solves in a row -> level up; two puzzles with 2+ errors -> level down. */
function finishPuzzle(g, errors) {
  const s = State.streak[g] || (State.streak[g] = { good: 0, bad: 0 });
  if (errors === 0) { s.good++; s.bad = 0; if (s.good >= 2) { setLevel(g, getLevel(g) + 1); s.good = 0; return 'up'; } }
  else if (errors >= 2) { s.bad++; s.good = 0; if (s.bad >= 2) { setLevel(g, getLevel(g) - 1); s.bad = 0; return 'down'; } }
  else { s.good = 0; }
  return '';
}
/* Just-in-time targeting: the most frequent fine-grained error among the last 6 in this game, if it appears 2+ times. */
function noteError(g, sub) { const r = State.recentErr[g] || (State.recentErr[g] = []); r.push(sub); if (r.length > 6) r.shift(); }
function focusFor(g, allowed) {
  const r = State.recentErr[g] || []; const c = {};
  for (const x of r) if (allowed.includes(x)) c[x] = (c[x] || 0) + 1;
  let best = null; for (const [k, v] of Object.entries(c)) if (v >= 2 && (!best || v > c[best])) best = k;
  return best;
}
function rememberKey(g, key) { const r = State.recent[g] || (State.recent[g] = []); r.push(key); if (r.length > 40) r.shift(); }
const seenKey = (g, key) => (State.recent[g] || []).includes(key);

// ---------- logging ----------
const COLS = ['ts', 'student', 'consent', 'session', 'kind', 'game', 'mode', 'level', 'puzzle_id', 'source', 'focus', 'puzzle',
  'attempt_no', 'correct', 'misconception', 'subtype', 'response', 'expected', 'time_ms', 'candidates', 'rejects', 'detail'];
const LOGKEY = 'dmg_events_v1';
const Log = {
  all() { try { return JSON.parse(localStorage.getItem(LOGKEY) || '[]'); } catch { return []; } },
  add(e) {
    const all = this.all();
    all.push({ ts: new Date().toISOString(), student: State.sid, consent: State.consent, session: State.session, ...e });
    try { localStorage.setItem(LOGKEY, JSON.stringify(all)); } catch (err) { console.warn('log storage full', err); }
  },
  clear() { localStorage.removeItem(LOGKEY); }
};
function csvEsc(v) { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function toCSV(rows) { return [COLS.join(','), ...rows.map(r => COLS.map(c => csvEsc(r[c])).join(','))].join('\n'); }
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((k, i) => [k, r[i] ?? ''])));
}
function download(name, text, type = 'text/csv') {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); setTimeout(() => a.remove(), 100);
}
/* One tracker per puzzle: logs every attempt with time since the puzzle appeared. */
class Tracker {
  constructor(game, mode, level, puzzle, source, focus) {
    Object.assign(this, { game, mode, level, puzzle, source: source || 'generator', focus: focus || '', id: game[0] + '-' + uid(), n: 0, errors: 0, t0: performance.now(), done: false });
  }
  attempt(correct, sub, response, expected, detail) {
    this.n++; if (!correct) { this.errors++; if (sub) noteError(this.game, sub); Fun.onMiss(); }
    Log.add({ kind: 'attempt', game: this.game, mode: this.mode, level: this.level, puzzle_id: this.id, source: this.source, focus: this.focus,
      puzzle: this.puzzle, attempt_no: this.n, correct: correct ? 1 : 0, misconception: correct ? '' : codeOf(sub), subtype: sub || '',
      response, expected, time_ms: Math.round(performance.now() - this.t0), detail: detail || '' });
  }
  complete() { if (this.done) return ''; this.done = true; const lv = finishPuzzle(this.game, this.errors); Fun.onSolve(this, performance.now() - this.t0); return lv; }
  skip() { if (this.done) return; this.done = true; Log.add({ kind: 'skip', game: this.game, mode: this.mode, level: this.level, puzzle_id: this.id, source: this.source, puzzle: this.puzzle, attempt_no: this.n, time_ms: Math.round(performance.now() - this.t0) }); }
}

/* ---------- validated generation ----------
   make() proposes a candidate; validate() returns a list of failed checks.
   Rejected candidates are counted by reason and the loop repairs by re-proposing.
   Each accepted puzzle logs a 'gen' row with candidates tried and rejection reasons. */
function generate(game, mode, level, focus, make, validate, max = 600) {
  const rejects = {}; let n = 0;
  while (n < max) {
    n++;
    let c, reasons;
    try { c = make(); reasons = c ? validate(c) : ['no-candidate']; } catch (err) { reasons = ['exception:' + err.message]; }
    if (!reasons.length) {
      Log.add({ kind: 'gen', game, mode, level, source: 'generator', focus: focus || '', correct: 1, candidates: n, rejects: fmtRejects(rejects) });
      return c;
    }
    for (const r of reasons) rejects[r] = (rejects[r] || 0) + 1;
  }
  Log.add({ kind: 'gen', game, mode, level, source: 'generator', focus: focus || '', correct: 0, candidates: n, rejects: fmtRejects(rejects), detail: 'gave up' });
  return null;
}
const fmtRejects = r => Object.entries(r).map(([k, v]) => k + ':' + v).join('|');

/* =========================================================================
   EXPRESSION TREES
   ========================================================================= */
const OPS = { '+': { p: 1, c: 1 }, '-': { p: 1, c: 0 }, '*': { p: 2, c: 1 }, '/': { p: 2, c: 0 }, '^': { p: 3, c: 0, r: 1 } };
const isOp = t => Object.prototype.hasOwnProperty.call(OPS, t);
const leafOK = v => typeof v === 'string' && /^([A-Za-z]|\d+)$/.test(v);
function eq(a, b) {
  if (!a || !b || a.empty || b.empty) return false;
  if (a.op || b.op) return a.op === b.op && eq(a.l, b.l) && eq(a.r, b.r);
  return a.v === b.v;
}
const pre = n => n.empty ? ['?'] : n.op ? [n.op, ...pre(n.l), ...pre(n.r)] : [n.v];
const post = n => n.empty ? ['?'] : n.op ? [...post(n.l), ...post(n.r), n.op] : [n.v];
const inord = n => n.empty ? ['?'] : n.op ? [...inord(n.l), n.op, ...inord(n.r)] : [n.v];
const nodesOf = n => n.op ? [n, ...nodesOf(n.l), ...nodesOf(n.r)] : [n];
const opCount = n => n.op ? 1 + opCount(n.l) + opCount(n.r) : 0;
const hasEmpty = n => !!(n.empty || (n.op && (hasEmpty(n.l) || hasEmpty(n.r))));
/* Infix with the minimum parentheses needed (or fully parenthesized). */
function infix(n, full = false, pp = 0, side = '', pop = '') {
  if (!n.op) return n.v;
  const p = OPS[n.op].p;
  const body = infix(n.l, full, p, 'L', n.op) + ' ' + n.op + ' ' + infix(n.r, full, p, 'R', n.op);
  if (!pop) return body;
  const need = full || p < pp || (p === pp && (OPS[pop].r ? side === 'L' : side === 'R'));
  return need ? '(' + body + ')' : body;
}
function tokenize(str) {
  str = String(str).replace(/[×·]/g, '*').replace(/÷/g, '/').replace(/↑/g, '^').replace(/[−–]/g, '-');
  const toks = str.match(/[A-Za-z]|\d+|[-+*/^()]/g) || [];
  if (toks.join('') !== str.replace(/\s+/g, '')) throw Error('unknown symbol');
  return toks;
}
/* Shunting-yard. mode 'std' = real rules; 'flat' = ignore precedence (left to right);
   'rassoc' = group same-level operators from the right. The last two model misconceptions. */
function parseInfix(str, mode = 'std') {
  const toks = tokenize(str), out = [], ops = [];

  const el = $('#stats'); if (!el) return;
  if (!State.sid || !Fun.p || !Fun.p.avatar) { el.replaceChildren(); return; }
  const r = Fun.rank(), p = Fun.p, pct = r.next ? Math.round(100 * (p.xp - r.at) / (r.next[0] - r.at)) : 100;
  el.replaceChildren(avatarSVG(p.avatar, 'happy', 34), h('div', {}, h('div', { class: 'rk' }, r.name, ' · ', p.xp, ' XP'), h('div', { class: 'xpbar' }, h('i', { style: `width:${pct}%` }))),
    h('span', { class: 'coin' }, '● ', p.coins), p.streak >= 2 ? h('span', { class: 'flame' }, '🔥 ', p.streak) : '');
}
function regionBanner(g) {
  const R = REGIONS[g], c = regionChapter(g);
  return h('div', { class: 'banner', style: `--rc:${R.color}` },
    h('div', { class: 'bicon' }, R.icon),
    h('div', { style: 'flex:1' }, h('div', { class: 'btitle' }, R.name), h('div', { class: 'bsub' }, c.title + ' · ' + R.blurb),
      h('div', { class: 'xpbar wide' }, h('i', { style: `width:${Math.min(100, Math.round(100 * c.n / c.max))}%;background:${R.color}` })),
      h('div', { class: 'small' }, `Restoration: ${Math.min(c.n, c.max)} of ${c.max} puzzles`)));
}
function avatarPicker(onPick, current) {
  return h('div', { class: 'avatars' }, Object.entries(AVATARS).map(([id, A]) => h('button', { class: 'avbtn' + (current === id ? ' on' : ''), title: A.name, onclick: () => onPick(id) }, avatarSVG(id, 'happy', 64), h('div', { class: 'small' }, A.name.split(' ')[0]))));
}

/* ---------- boot ---------- */
(function boot() {
  const m = location.hash.match(/pack=([^&]+)/);
  if (m) {
    try {
      const arr = JSON.parse(unb64(decodeURIComponent(m[1])));
      for (const p of arr) if (!validatePackItem(p).length && State.queue[p.game]) State.queue[p.game].push(p);
    } catch (e) { console.warn('bad pack', e); }
  }
  go('home');
})();
</script>
